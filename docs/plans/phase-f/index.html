<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tend Web 设计稿（草稿）</title>
<style>
body { margin: 0; font: 14px/22px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #eceef1; color: #0f1115; }
header { padding: 20px 28px 4px; }
h1 { font-size: 18px; margin: 0 0 4px; }
p { margin: 4px 0; color: rgba(15,17,21,.7); max-width: 980px; }
.bar { display: flex; gap: 8px; padding: 12px 28px; flex-wrap: wrap; }
.bar a { padding: 6px 12px; border-radius: 999px; background: #fff; color: inherit; text-decoration: none; border: 1px solid rgba(15,17,21,.1); font-size: 13px; }
.stage { display: flex; gap: 28px; padding: 8px 28px 40px; align-items: flex-start; flex-wrap: wrap; }
.frame { background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(15,17,21,.12); overflow: hidden; }
.desk { width: 1280px; height: 800px; }
.phone { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #111; box-sizing: content-box; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
.label { font-size: 12px; color: rgba(15,17,21,.55); margin: 0 0 8px 4px; }
</style>
</head>
<body>
<header>
  <h1>tend Web 设计稿（草稿，阶段 F）</h1>
  <p>一个页面同时适配桌面和手机（左：1280 宽的桌面；右：iPhone 尺寸）。视觉语言参考 dsh：中性底色、一个蓝色强调色、系统字体、22px 圆角的输入框、单行可展开的工具调用、状态点。数据是虚构的示例。</p>
  <p>可以直接点：任务行和回复里的任务标签打开详情；工具调用行可以展开；手机的底部标签切换对话、任务、待处理；“浅色 / 深色”切换主题。</p>
</header>
<div class="bar">
  <a href="app.html" target="_blank">单独打开（拖动窗口宽度看响应式）</a>
  <a href="app.html?details" target="_blank">桌面 · 打开任务详情</a>
  <a href="app.html?dark" target="_blank">深色</a>
</div>
<div class="stage">
  <div><div class="label">桌面</div><div class="frame desk"><iframe src="app.html?details"></iframe></div></div>
  <div><div class="label">手机 · 对话</div><div class="frame phone"><iframe src="app.html"></iframe></div></div>
  <div><div class="label">手机 · 待处理</div><div class="frame phone"><iframe src="app.html?view=decisions"></iframe></div></div>
  <div><div class="label">手机 · 任务详情</div><div class="frame phone"><iframe src="app.html?view=tasks&details"></iframe></div></div>
</div>
</body>
</html>

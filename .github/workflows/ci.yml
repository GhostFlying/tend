name: app-cost-pair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          role: app
      - name: compare immutable sources on one runner
        run: |
          cp .github/scripts/measure-app-pair.py "$RUNNER_TEMP/measure-app-pair.py"
          python3 "$RUNNER_TEMP/measure-app-pair.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-cost-pair
          path: ${{ runner.temp }}/app-cost-pair
          if-no-files-found: error
          retention-days: 14

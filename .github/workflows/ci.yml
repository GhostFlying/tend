name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
        id: go
        with:
          role: quality
      - name: static checks and capability coverage
        run: make ci-check capability-check protocol-check fmt-check vet staticcheck
      - name: release publication recovery checks
        run: python3 -m unittest discover -s .github/scripts -p '*_test.py'
      - name: publish main build snapshot
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.go.outputs.build-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.build-path }}
          key: ${{ steps.go.outputs.build-key }}

  race:
    name: race (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [app, api, mainthread, e2e, other]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
        id: go
        with:
          role: ${{ matrix.group }}
      - name: race tests
        env:
          APP_TEST_SHARDS: 4
          TEST_GROUP: ${{ matrix.group }}
        run: make test
      - name: publish main build snapshot
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.go.outputs.build-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.build-path }}
          key: ${{ steps.go.outputs.build-key }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web checks and build
        run: make web-check
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: internal/webui/dist/app
          if-no-files-found: error
          retention-days: 1

  layout:
    name: layout (${{ matrix.group }})
    needs: web
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ${{ runner.temp }}/web-app
      - name: install browser dependencies
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: browser regressions
        env:
          TEND_LAYOUT_BUILD_ROOT: ${{ runner.temp }}/web-app
          TEND_LAYOUT_OUTPUT: ${{ runner.temp }}/layout
          LAYOUT_GROUP: ${{ matrix.group }}
        run: pnpm --dir web exec node scripts/layout-groups.ts "$LAYOUT_GROUP"

  cross:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
        id: go
        with:
          role: cross
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: internal/webui/dist/app
      - name: cross-compile with the actual web app
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
      - name: publish main build snapshot
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.go.outputs.build-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.go.outputs.build-path }}
          key: ${{ steps.go.outputs.build-key }}

  release-build:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
        with:
          role: release-${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: internal/webui/dist/app
      - name: build and verify complete distribution
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          go run ./internal/release/packagecmd --arch "$RELEASE_ARCH" --commit "$GITHUB_SHA" --output .local/release
          go run ./internal/release/packagecmd --component maintainer --arch "$RELEASE_ARCH" --commit "$GITHUB_SHA" --output .local/release
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-linux-${{ matrix.arch }}
          path: .local/release/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release-assemble:
    needs: release-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
        with:
          role: release-assemble
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-linux-*
          merge-multiple: true
          path: .local/platform-packages
      - name: assemble and verify heterogeneous fleet bundle
        run: |
          mkdir -p .local/fleet-input/amd64 .local/fleet-input/arm64
          tar -xzf ".local/platform-packages/tend-main-$GITHUB_SHA-linux-amd64.tar.gz" -C .local/fleet-input/amd64
          tar -xzf ".local/platform-packages/tend-main-$GITHUB_SHA-linux-arm64.tar.gz" -C .local/fleet-input/arm64
          go run ./internal/release/packagecmd --input-amd64 .local/fleet-input/amd64 --input-arm64 .local/fleet-input/arm64 --commit "$GITHUB_SHA" --output .local/release-fleet
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-linux-fleet
          path: .local/release-fleet/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Keep the existing required check name while rejecting every incomplete job.
  check:
    if: ${{ always() }}
    needs: [quality, race, web, layout, cross, release-build, release-assemble]
    runs-on: ubuntu-latest
    steps:
      - name: require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  release-publish:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-linux-*
          merge-multiple: true
          path: .local/release-assets
      - name: publish immutable complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_DIR: .local/release-assets
        run: python3 .github/scripts/publish-release.py

  cache-maintenance:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const { prune } = require('./.github/scripts/go-cache.cjs');
            await prune({ github, context, core });

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: static checks and capability coverage
        run: make capability-check protocol-check fmt-check vet staticcheck

  race:
    name: race (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [app, api, mainthread, e2e, other]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: race tests
        env:
          APP_TEST_SHARDS: 4
          TEST_GROUP: ${{ matrix.group }}
        run: make test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The web client's toolchain; pnpm's version comes from web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web checks and build
        run: make web-check
      - name: mobile layout regression
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          pnpm --dir web test:layout
      - name: mobile decision layout regression
        run: pnpm --dir web test:decision-layout
      - name: repository layout regression
        run: pnpm --dir web test:repos-layout
      - name: work item progress regression
        run: pnpm --dir web test:work-items-layout
      - name: delivery refresh reconciliation
        run: pnpm --dir web test:delivery-refresh
      - name: followup lifecycle and recovery
        run: pnpm --dir web test:followups
      - name: agent directory read-only and environment regression
        env:
          TEND_LAYOUT_OUTPUT: ${{ runner.temp }}/tend-agent-directory
        run: pnpm --dir web test:agent-directory
      - name: agent conversation routing and layout
        run: pnpm --dir web test:agents
      - name: Issue source, notifications and first-run regression
        env:
          TEND_LAYOUT_OUTPUT: ${{ runner.temp }}/tend-issue-surfaces
        run: pnpm --dir web test:issue-surfaces-layout
      - name: Issue detail conversation regression
        env:
          TEND_LAYOUT_OUTPUT: ${{ runner.temp }}/tend-issue-detail
        run: pnpm --dir web test:issue-detail-layout
      - name: token usage and rollout regression
        run: pnpm --dir web test:usage
      - name: navigation layout regression
        env:
          TEND_LAYOUT_OUTPUT: ${{ runner.temp }}/tend-navigation
        run: pnpm --dir web test:navigation-layout
      - name: all-route UI tour
        env:
          TEND_LAYOUT_OUTPUT: ${{ runner.temp }}/tend-ui-tour
        run: pnpm --dir web test:ui-tour
      - name: cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

  # Keep the existing required check name while rejecting every incomplete job.
  check:
    if: ${{ always() }}
    needs: [quality, race, web]
    runs-on: ubuntu-latest
    steps:
      - name: require all checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

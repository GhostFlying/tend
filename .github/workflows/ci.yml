name: app-race-runner-experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: app (${{ matrix.arm }})
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arm: single, lane: 0, lanes: 1}
          - {arm: double-a, lane: 0, lanes: 2}
          - {arm: double-b, lane: 1, lanes: 2}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-go
        with:
          role: app
      - name: measure assigned shards
        env:
          BENCH_ARM: ${{ matrix.arm }}
          BENCH_LANE: ${{ matrix.lane }}
          BENCH_LANES: ${{ matrix.lanes }}
        run: python3 .github/scripts/experiment-app-runners.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-race-${{ matrix.arm }}
          path: ${{ runner.temp }}/app-race/
          if-no-files-found: error
          retention-days: 7
